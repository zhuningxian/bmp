{% extends "base.html" %}

{% block title %}搜索图书 - 图书馆智能推荐系统{% endblock %}

{% block content %}
<div class="container my-5">
    <!-- 搜索区域 -->
    <div class="row mb-5">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">
                        <i class="fas fa-search me-2"></i>搜索图书
                    </h2>
                    
                    <form onsubmit="performSearch(event)">
                        <div class="input-group input-group-lg mb-3">
                            <input type="text" class="form-control" id="searchInput" 
                                   placeholder="输入图书名称、作者或关键词..." required>
                            <button class="btn btn-primary" type="submit">
                                <i class="fas fa-search me-2"></i>搜索
                            </button>
                        </div>
                    </form>
                    
                    <div class="row mt-4">
                        <div class="col-md-6">
                            <label class="form-label">按分类筛选:</label>
                            <select class="form-select" id="categoryFilter" onchange="filterByCategory()">
                                <option value="">所有分类</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">排序方式:</label>
                            <select class="form-select" id="sortOrder" onchange="sortResults()">
                                <option value="relevance">按相关性排序</option>
                                <option value="title">按书名排序</option>
                                <option value="author">按作者排序</option>
                                <option value="year">按出版年份排序</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索结果 -->
    <div class="row">
        <div class="col-12">
            <div id="searchResults" style="display: none;">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">
                            <i class="fas fa-list me-2"></i>搜索结果
                            <span class="badge bg-primary ms-2" id="resultCount">0</span>
                        </h5>
                    </div>
                    <div class="card-body" id="resultsContainer">
                        <!-- 搜索结果将在这里显示 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 推荐区域 -->
    <div class="row mt-5">
        <div class="col-12">
            <h3 class="mb-4">
                <i class="fas fa-fire me-2"></i>热门图书推荐
            </h3>
            <div id="popularBooksContainer">
                <div class="text-center">
                    <div class="spinner"></div>
                    <p class="mt-3">加载中...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let searchResults = [];
let filteredResults = [];

document.addEventListener('DOMContentLoaded', function() {
    loadCategories();
    loadPopularBooks();
    
    // 检查URL参数
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    const category = urlParams.get('category');
    
    if (query) {
        document.getElementById('searchInput').value = query;
        performSearch();
    } else if (category) {
        document.getElementById('categoryFilter').value = category;
        searchByCategory(category);
    }
});

// 加载分类选项
async function loadCategories() {
    try {
        const response = await fetch('/api/categories');
        const data = await response.json();
        
        if (data.status === 'success') {
            const select = document.getElementById('categoryFilter');
            data.categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                select.appendChild(option);
            });
        }
    } catch (error) {
        console.error('加载分类失败:', error);
    }
}

// 执行搜索
async function performSearch(event) {
    if (event) {
        event.preventDefault();
    }
    
    const query = document.getElementById('searchInput').value.trim();
    if (!query) {
        alert('请输入搜索关键词');
        return;
    }
    
    try {
        showLoading('resultsContainer');
        document.getElementById('searchResults').style.display = 'block';
        
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&limit=20`);
        const data = await response.json();
        
        if (data.status === 'success') {
            searchResults = data.results;
            filteredResults = [...searchResults];
            displayResults(filteredResults);
            document.getElementById('resultCount').textContent = filteredResults.length;
        } else {
            showError('搜索失败: ' + data.message, 'resultsContainer');
        }
    } catch (error) {
        showError('网络错误，搜索失败', 'resultsContainer');
    }
}

// 按分类搜索
async function searchByCategory(category) {
    try {
        showLoading('resultsContainer');
        document.getElementById('searchResults').style.display = 'block';
        
        const response = await fetch(`/api/search?category=${encodeURIComponent(category)}&limit=20`);
        const data = await response.json();
        
        if (data.status === 'success') {
            searchResults = data.results;
            filteredResults = [...searchResults];
            displayResults(filteredResults);
            document.getElementById('resultCount').textContent = filteredResults.length;
        }
    } catch (error) {
        showError('加载分类图书失败', 'resultsContainer');
    }
}

// 按分类筛选
function filterByCategory() {
    const selectedCategory = document.getElementById('categoryFilter').value;
    
    if (selectedCategory) {
        filteredResults = searchResults.filter(book => 
            book.category && book.category.includes(selectedCategory)
        );
    } else {
        filteredResults = [...searchResults];
    }
    
    displayResults(filteredResults);
    document.getElementById('resultCount').textContent = filteredResults.length;
}

// 排序结果
function sortResults() {
    const sortOrder = document.getElementById('sortOrder').value;
    
    switch (sortOrder) {
        case 'title':
            filteredResults.sort((a, b) => a.title.localeCompare(b.title));
            break;
        case 'author':
            filteredResults.sort((a, b) => (a.author || '').localeCompare(b.author || ''));
            break;
        case 'year':
            filteredResults.sort((a, b) => (b.publication_year || 0) - (a.publication_year || 0));
            break;
        case 'relevance':
        default:
            filteredResults.sort((a, b) => (b.relevance_score || 0) - (a.relevance_score || 0));
            break;
    }
    
    displayResults(filteredResults);
}

// 显示搜索结果
function displayResults(results) {
    const container = document.getElementById('resultsContainer');
    
    if (results.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-5">
                <i class="fas fa-search fa-3x mb-3"></i>
                <h5>未找到相关图书</h5>
                <p>请尝试其他关键词或浏览热门图书</p>
            </div>
        `;
        return;
    }
    
    let html = '<div class="row g-4">';
    
    results.forEach(book => {
        html += `
            <div class="col-lg-6">
                <div class="book-card">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="category-badge">${book.category || '未分类'}</span>
                        ${book.relevance_score ? 
                            `<span class="badge bg-info">相关度: ${book.relevance_score}</span>` : 
                            ''
                        }
                    </div>
                    
                    <h5 class="card-title mb-2">${book.title}</h5>
                    <p class="text-muted mb-2">
                        <i class="fas fa-user me-1"></i>${book.author || '未知作者'}
                        <span class="mx-2">·</span>
                        <i class="fas fa-calendar me-1"></i>${book.publication_year || '未知年份'}
                    </p>
                    
                    <p class="card-text mb-3" style="max-height: 4rem; overflow: hidden;">
                        ${book.description || '暂无描述'}
                    </p>
                    
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary btn-sm" onclick="viewBookDetails(${book.id})">
                            <i class="fas fa-eye me-1"></i>查看详情
                        </button>
                        <button class="btn btn-outline-warning btn-sm" onclick="showRatingModal(${book.id}, '${book.title}')">
                            <i class="fas fa-star me-1"></i>评分
                        </button>
                        <button class="btn btn-outline-success btn-sm" onclick="getRecommendations(${book.id})">
                            <i class="fas fa-thumbs-up me-1"></i>相似推荐
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
    
    html += '</div>';
    container.innerHTML = html;
}

// 加载热门图书
async function loadPopularBooks() {
    try {
        const response = await fetch('/api/popular?limit=8');
        const data = await response.json();
        
        if (data.status === 'success') {
            displayPopularBooks(data.popular_books);
        }
    } catch (error) {
        console.error('加载热门图书失败:', error);
    }
}

// 显示热门图书
function displayPopularBooks(books) {
    const container = document.getElementById('popularBooksContainer');
    
    if (books.length === 0) {
        container.innerHTML = '<p class="text-center text-muted">暂无热门图书数据</p>';
        return;
    }
    
    let html = '<div class="row g-4">';
    
    books.forEach(book => {
        html += `
            <div class="col-lg-3 col-md-6">
                <div class="book-card">
                    <div class="text-center mb-3">
                        <span class="badge bg-warning">热度 ${book.popularity_score}</span>
                    </div>
                    
                    <h6 class="card-title mb-2">${book.title}</h6>
                    <p class="text-muted mb-2 small">
                        <i class="fas fa-user me-1"></i>${book.author || '未知作者'}
                    </p>
                    <p class="text-muted mb-3 small">
                        <span class="category-badge">${book.category || '未分类'}</span>
                    </p>
                    
                    <div class="text-center">
                        <button class="btn btn-outline-primary btn-sm" onclick="viewBookDetails(${book.id})">
                            查看详情
                        </button>
                    </div>
                </div>
            </div>
        `;
    });
    
    html += '</div>';
    container.innerHTML = html;
}

// 查看图书详情
function viewBookDetails(bookId) {
    window.location.href = `/book/${bookId}`;
}

// 显示评分模态框
function showRatingModal(bookId, bookTitle) {
    // 这里可以添加评分功能
    alert(`为《${bookTitle}》评分功能待开发`);
}

// 获取相似推荐
async function getRecommendations(bookId) {
    try {
        const response = await fetch(`/api/books/${bookId}/recommendations`);
        const data = await response.json();
        
        if (data.status === 'success') {
            // 显示相似图书
            if (data.similar_books && data.similar_books.length > 0) {
                let message = '相似图书推荐：\n\n';
                data.similar_books.slice(0, 5).forEach((book, index) => {
                    message += `${index + 1}. ${book.title}\n`;
                });
                alert(message);
            } else {
                alert('暂无相似图书推荐');
            }
        }
    } catch (error) {
        alert('获取推荐失败');
    }
}
</script>
{% endblock %}
