<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书馆智能推荐系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-book-reader me-2"></i>
                图书馆智能推荐系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#recommendations">推荐</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#books">图书</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#analysis">分析</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 用户选择区域 -->
        <div class="row mb-4">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-user me-2"></i>用户选择
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="userSelect" class="form-label">选择用户:</label>
                                <select id="userSelect" class="form-select">
                                    <option value="">请选择用户...</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="recommendMethod" class="form-label">推荐方法:</label>
                                <select id="recommendMethod" class="form-select">
                                    <option value="hybrid">混合推荐</option>
                                    <option value="collaborative">协同过滤</option>
                                    <option value="content">内容过滤</option>
                                    <option value="popularity">流行度推荐</option>
                                </select>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button id="getRecommendationsBtn" class="btn btn-primary">
                                <i class="fas fa-magic me-2"></i>获取推荐
                            </button>
                            <button id="getUserBehaviorBtn" class="btn btn-info ms-2">
                                <i class="fas fa-chart-line me-2"></i>行为分析
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-header">
                        <h6 class="mb-0">系统统计</h6>
                    </div>
                    <div class="card-body">
                        <div id="systemStats">
                            <div class="text-center">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 推荐结果区域 -->
        <div id="recommendations" class="row mb-4" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">
                            <i class="fas fa-star me-2"></i>为您推荐
                        </h5>
                        <span id="recommendationMethod" class="badge bg-success"></span>
                    </div>
                    <div class="card-body">
                        <div id="recommendationsList" class="row">
                            <!-- 推荐结果将在这里显示 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 用户行为分析区域 -->
        <div id="analysis" class="row mb-4" style="display: none;">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-chart-bar me-2"></i>用户行为分析
                        </h5>
                    </div>
                    <div class="card-body">
                        <div id="behaviorAnalysis">
                            <!-- 行为分析结果将在这里显示 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 图书操作区域 -->
        <div id="books" class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="fas fa-book me-2"></i>图书操作
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="bookSelect" class="form-label">选择图书:</label>
                                <select id="bookSelect" class="form-select">
                                    <option value="">请选择图书...</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="rating" class="form-label">评分 (1-5):</label>
                                <input type="number" id="rating" class="form-control" min="1" max="5" step="1">
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">&nbsp;</label>
                                <div>
                                    <button id="rateBookBtn" class="btn btn-warning">
                                        <i class="fas fa-star me-2"></i>评分
                                    </button>
                                    <button id="borrowBookBtn" class="btn btn-success ms-2">
                                        <i class="fas fa-download me-2"></i>借阅
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 加载提示模态框 -->
    <div class="modal fade" id="loadingModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2 mb-0">处理中，请稍候...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto">系统通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastBody">
                <!-- 通知内容 -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
